apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-todo-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-todo-ui
  template:
    metadata:
      labels:
        app: agentic-todo-ui
    spec:
      containers:
        - name: agentic-todo-ui
          image: agenticdevopsacr.azurecr.io/todo-ui:latest
          ports:
            - containerPort: 8080
