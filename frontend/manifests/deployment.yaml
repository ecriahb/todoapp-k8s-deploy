apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-todo-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-todo-ui
  template:
    metadata:
      labels:
        app: agentic-todo-ui
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: agentic-todo-ui
          image: agenticdevopsacr.azurecr.io/todo-ui:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
