apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-incident-create
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-incident-create
  template:
    metadata:
      labels:
        app: agentic-incident-create
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: agentic-incident-create
          env:
            - name: CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: agentic-sql-secret
                  key: CONNECTION_STRING
          image: agenticdevopsacr.azurecr.io/incident-create:latest
          ports:
            - containerPort: 8000
