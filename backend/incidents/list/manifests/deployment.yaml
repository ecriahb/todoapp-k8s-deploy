apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-get-tasks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-get-tasks
  template:
    metadata:
      labels:
        app: agentic-get-tasks
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: agentic-get-tasks
          image: agenticdevopsacr.azurecr.io/get-tasks:latest
          ports:
            - containerPort: 8000
          env:
            - name: CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: agentic-sql-secret
                  key: CONNECTION_STRING
